[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maven_market"
version = "0.1.0"
description = "Maven Market - Secure Retail Analytics Lakehouse (Databricks capstone)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "confluent-kafka>=2.3",
    "pymongo>=4.6",
]

[project.scripts]
governance = "maven_market.jobs.governance:main"
pipeline_audit = "maven_market.jobs.pipeline_audit:main"
mongo_seed = "maven_market.producers.mongo_seed:main"
kafka_producer = "maven_market.producers.kafka_producer:main"

[project.optional-dependencies]
# Local and CI checks do not require a Spark runtime.
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

